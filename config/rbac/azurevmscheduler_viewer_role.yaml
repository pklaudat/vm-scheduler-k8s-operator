# This rule is not used by the project vm-scheduler-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to klaudat.io.klaudat.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vm-scheduler-operator
    app.kubernetes.io/managed-by: kustomize
  name: azurevmscheduler-viewer-role
rules:
- apiGroups:
  - klaudat.io.klaudat.io
  resources:
  - azurevmschedulers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - klaudat.io.klaudat.io
  resources:
  - azurevmschedulers/status
  verbs:
  - get
